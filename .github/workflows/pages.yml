name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'pages/**'
  workflow_run:
    workflows: ["Auto Build and Release Morphe", "Manual Patch and Update"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'pages/package-lock.json'
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Install dependencies
        working-directory: ./pages
        run: npm ci
        
      - name: Build with Vite
        working-directory: ./pages
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # GitHub Pages occasionally stalls in "purging_cdn" and times out.
        # Allow one retry before failing the deployment.
        continue-on-error: true

      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4

      - name: Report Pages deployment failure
        if: failure()
        run: echo "::error::GitHub Pages deployment failed twice. The next deployment will retry automatically."

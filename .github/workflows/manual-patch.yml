name: Manual Patch and Update


on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (from apps/ folder)'
        required: true
        type: string
        default: 'youtube'
      source:
        description: 'Source name (from sources/ folder)'
        required: true
        type: string
        default: 'revanced'
      version:
        description: 'Specific version (leave empty for latest)'
        required: false
        type: string
        default: ''
      architecture:
        description: 'Architecture to build'
        required: false
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - universal
        default: 'universal'
      replace_in_release:
        description: 'Replace APK in existing release'
        required: true
        type: boolean
        default: true

jobs:
  manual-patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CUSTOM_GH_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Set Specific Version (if provided)
        if: ${{ inputs.version != '' }}
        run: |
          # Update app config with specific version
          for dir in apps/apkmirror apps/apkpure apps/uptodown; do
            config_file="$dir/${{ inputs.app_name }}.json"
            if [ -f "$config_file" ]; then
              echo "Updating $config_file with version ${{ inputs.version }}"
              # Update JSON with specific version
              python -c "
              import json, sys, os
              with open('$config_file', 'r') as f:
                  config = json.load(f)
              config['version'] = '${{ inputs.version }}'
              with open('$config_file', 'w') as f:
                  json.dump(config, f, indent=2)
              "
              echo "Updated: $config_file"
              break
            fi
          done
      
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install requests beautifulsoup4
      
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Link Google Play Account (gplaydl)
        env:
          GPLAYDL_TOKEN: ${{ secrets.GPLAYDL_TOKEN }}
        run: |
          if [ -n "$GPLAYDL_TOKEN" ]; then
            mkdir -p ~/.config/gplaydl
            jq -n --arg token "$GPLAYDL_TOKEN" '{dispenser: "https://dispenser.gplaydl.com", api_key: $token}' > ~/.config/gplaydl/config.json
            echo "[OK] gplaydl config created"
          else
            echo "[WARN] GPLAYDL_TOKEN secret not set — Google Play source will be skipped"
          fi

      - name: Build APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ inputs.source }}
          ARCH: ${{ inputs.architecture }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXODUS_API_KEY: ${{ secrets.EXODUS_API_KEY }}
        run: |
          echo "Building ${{ inputs.app_name }} with ${{ inputs.source }} for ${{ inputs.architecture }} architecture..."
          python -m src

      
      - name: Find Built APK
        id: find-apk
        run: |
          # Find the built APK file(s)
          apk_files=$(ls -1 *.apk 2>/dev/null)
          if [ -z "$apk_files" ]; then
            echo "[ERROR] No APK files found"
            exit 1
          fi
          
          # Fix for multi-line output in GitHub Actions
          {
            echo "apk_files<<EOF"
            echo "$apk_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          
          echo "apk_count=$(echo "$apk_files" | wc -l)" >> "$GITHUB_OUTPUT"
          
          # Print for debugging
          echo "Found these APKs:"
          echo "$apk_files"
      
      - name: Upload as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-apk-${{ inputs.app_name }}-${{ inputs.architecture }}
          path: "*.apk"
      
      - name: Check Existing Release
        if: ${{ inputs.replace_in_release == true }}
        id: check-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            echo "[OK] Release 'latest' exists"
            echo "release_exists=true" >> $GITHUB_OUTPUT
          else
            echo "[INFO] Release 'latest' does not exist"
            echo "release_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Update Release
        if: ${{ inputs.replace_in_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Updating release efficiently..."
          
          # 1. GENERATE FILE LIST FOR NOTES
          # We fetch the list of names via API so the release notes remain accurate
          # without needing to download the actual heavy APK files.
          if [ "${{ steps.check-release.outputs.release_exists }}" == "true" ]; then
            python scripts/remove_orphaned_assets.py || echo "[WARN] remove_orphaned_assets.py failed; continuing..."
            gh release view latest --json assets --jq '.assets[].name' > current_assets.txt
          else
            touch current_assets.txt
          fi
          
          # Add the new APK name(s) to the text file
          for apk in *.apk; do
            echo "$apk" >> current_assets.txt
          done
          
          # 2. UPDATE MANIFEST & CREATE RELEASE NOTES
          echo "Updating manifest and generating Obtainium & release notes..."
          # Download manifest from latest release if available to ensure we have existing catalog
          gh release download latest -p "manifest.json" --clobber || true

          # Merge newly built record into manifest.json
          python scripts/merge_manifest.py || echo "[WARN] merge_manifest.py failed"

          python scripts/generate_obtainium.py || true
          python scripts/validate_obtainium.py || true
          python scripts/generate_release_notes.py || {
            echo "# Morphe APKs - Custom Build" > release_notes.md
            echo "Updated ${{ inputs.app_name }} (${{ inputs.architecture }})." >> release_notes.md
          }
          
          # 3. PERFORM UPDATE (CLOBBER) OR CREATE
          if [ "${{ steps.check-release.outputs.release_exists }}" == "true" ]; then
            echo "Uploading new assets (clobbering existing)..."

            # Delete superseded older-version APKs for this app/arch before upload.
            # --clobber only overwrites exact filenames; since APK names embed the
            # version, the old version (e.g. v2.4.0) would otherwise remain next
            # to the new v2.5.0. cleanup_old_apks.py removes any release APK that
            # shares a {app}-{arch}- prefix with a freshly built APK but has a
            # different version.
            : > keep_apks.txt
            for apk in *.apk; do
              [ -f "$apk" ] || continue
              echo "$apk" >> keep_apks.txt
            done
            python scripts/cleanup_old_apks.py --release latest --keep-file keep_apks.txt || \
              echo "[WARN] cleanup_old_apks.py failed; continuing with clobber upload"

            ASSETS=( *.apk )
            if ls build_records/*.json 1> /dev/null 2>&1; then
              ASSETS+=( build_records/*.json )
            fi
            if [ -f manifest.json ]; then
              ASSETS+=( manifest.json )
            fi
            if [ -f obtainium.json ]; then
              ASSETS+=( obtainium.json )
            fi

            # --clobber overwrites the file if it exists, adds it if it doesn't
            for i in {1..3}; do
              gh release upload latest "${ASSETS[@]}" --clobber && break || {
                if [ $i -lt 3 ]; then
                  echo "[WARN] Upload failed (attempt $i/3). Retrying in 10s..."
                  sleep 10
                else
                  echo "[ERROR] Upload failed after 3 attempts."
                  exit 1
                fi
              }
            done

            echo "Updating release title and notes..."
            gh release edit latest \
              --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
              --notes-file release_notes.md
              
          else
            echo "Creating new release..."
            for i in {1..3}; do
              gh release create "latest" \
                --title "Morphe APKs - $(date +'%Y-%m-%d %H:%M')" \
                --notes-file release_notes.md \
                "${ASSETS[@]}" \
                --latest && break || {
                if [ $i -lt 3 ]; then
                  echo "[WARN] Create release failed (attempt $i/3). Retrying in 10s..."
                  sleep 10
                else
                  echo "[ERROR] Create release failed after 3 attempts."
                  exit 1
                fi
              }
            done
          fi
          
          echo "Release updated successfully!"

      - name: Update Repository, README & Pages Data
        if: ${{ inputs.replace_in_release == true }}
        run: |
          echo "Syncing Manifest, Obtainium, README, and Pages Data..."
          mkdir -p pages/public
          cp manifest.json pages/public/manifest.json || true
          if [ -f obtainium.json ]; then
            cp obtainium.json pages/public/obtainium.json || true
          fi
          if ls build_records/build_report_*.json 1> /dev/null 2>&1; then
            cp build_records/build_report_*.json pages/public/build_report.json || true
          fi

          python scripts/update_readme_obtainium.py || echo "[WARN] update_readme_obtainium.py failed"

          # Only commit if there are changes to the data
          if [[ -n $(git status -s manifest.json obtainium.json README.md pages/public) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f manifest.json obtainium.json README.md pages/public/
            git commit -m "chore: auto-sync manifest, obtainium bundle, and README catalog [skip ci]" || true
            git push
            echo "Repository and Pages data pushed successfully!"
          else
            echo "No changes to data, skipping push."
          fi
      
      - name: Show Download Links
        if: ${{ inputs.replace_in_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_url=$(gh release view latest --json url --jq .url)
          echo "Updated Release URL: $release_url"
          echo ""
          echo "Direct APK links:"
          for apk in *.apk; do
            echo "  - $release_url/download/$apk"
          done

      - name: Send Telegram Build Report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHATID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/send_telegram_report.py
      
      - name: Cleanup Version Override
        if: ${{ inputs.version != '' && always() }}
        run: |
          # Reset version to empty in configs
          for dir in apps/apkmirror apps/apkpure apps/uptodown; do
            config_file="$dir/${{ inputs.app_name }}.json"
            if [ -f "$config_file" ]; then
              echo "Resetting version in $config_file"
              python -c "
              import json, sys, os
              with open('$config_file', 'r') as f:
                  config = json.load(f)
              config['version'] = ''
              with open('$config_file', 'w') as f:
                  json.dump(config, f, indent=2)
              "
            fi
          done
